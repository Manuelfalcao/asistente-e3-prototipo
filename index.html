<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Asistente E3 · PROTOTIPO</title>
<meta name="theme-color" content="#1d4ed8">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-title" content="E3 proto">
<!--
  PROTOTIPO DESCARTABLE (Ticket 7 del mapa Asistente E3).
  Pregunta: ¿la PWA anda en Android, iPhone y PC, sin conexión y con el Inventario guardado?
  ¿Y el mismo archivo mandado suelto por WhatsApp?
  Todo va embebido en este archivo para que sirva también como "HTML suelto".
-->
<style>
  :root { --azul:#1d4ed8; --fondo:#f8fafc; --tarjeta:#fff; --texto:#0f172a; --suave:#64748b; --ok:#15803d; --mal:#b91c1c; --borde:#e2e8f0; }
  @media (prefers-color-scheme: dark) { :root { --fondo:#0b1220; --tarjeta:#111a2e; --texto:#e2e8f0; --suave:#94a3b8; --borde:#1e293b; --ok:#4ade80; --mal:#f87171; } }
  * { box-sizing: border-box; }
  body { margin:0; font:16px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background:var(--fondo); color:var(--texto); padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom); }
  header { background:var(--azul); color:#fff; padding:12px 16px; }
  header h1 { margin:0; font-size:18px; }
  header small { opacity:.85; }
  main { max-width:640px; margin:0 auto; padding:12px 16px 40px; }
  section { background:var(--tarjeta); border:1px solid var(--borde); border-radius:12px; padding:14px; margin:12px 0; }
  h2 { font-size:16px; margin:0 0 10px; }
  label { display:block; font-size:14px; color:var(--suave); margin-top:8px; }
  input, select, textarea { width:100%; font:inherit; padding:10px; border:1px solid var(--borde); border-radius:8px; background:var(--fondo); color:var(--texto); }
  textarea { font:12px/1.3 ui-monospace, Menlo, Consolas, monospace; min-height:70px; }
  .fila { display:flex; gap:8px; } .fila > * { flex:1; }
  button { font:inherit; padding:10px 14px; border:0; border-radius:8px; background:var(--azul); color:#fff; margin-top:10px; cursor:pointer; }
  button.sec { background:transparent; color:var(--azul); border:1px solid var(--azul); }
  .res { font-size:20px; font-weight:600; margin-top:10px; }
  .formula { color:var(--suave); font-size:14px; }
  ul { list-style:none; padding:0; margin:8px 0 0; }
  li { display:flex; justify-content:space-between; align-items:center; padding:6px 0; border-bottom:1px solid var(--borde); }
  li button { margin:0; padding:4px 10px; background:transparent; color:var(--mal); border:1px solid var(--mal); }
  table { width:100%; border-collapse:collapse; font-size:13px; }
  td { padding:5px 4px; border-bottom:1px solid var(--borde); vertical-align:top; word-break:break-word; }
  td:first-child { color:var(--suave); width:42%; }
  .ok { color:var(--ok); font-weight:600; } .mal { color:var(--mal); font-weight:600; }
  #aviso { display:none; position:sticky; top:0; z-index:5; background:#facc15; color:#000; padding:10px 16px; text-align:center; }
  #aviso button { margin:0 0 0 8px; padding:6px 12px; background:#000; }
  #alerta { display:none; background:#fee2e2; color:#7f1d1d; border-radius:8px; padding:10px; margin-top:8px; font-size:14px; }
</style>
</head>
<body>
<div id="aviso">Hay una versión nueva del Asistente. <button id="recargar">Recargar</button></div>
<header>
  <h1>Asistente E3 · PROTOTIPO</h1>
  <small>Versión <b id="ver"></b> · descartable, solo para elegir el formato</small>
</header>
<main>

<section>
  <h2>Reactancia</h2>
  <div class="fila">
    <div><label for="f">Frecuencia</label><input id="f" value="145M" inputmode="decimal" autocomplete="off"></div>
    <div><label for="lc">L o C</label><input id="lc" value="100n" inputmode="decimal" autocomplete="off"></div>
  </div>
  <label for="tipo">El segundo valor es</label>
  <select id="tipo"><option value="L">una inductancia (H)</option><option value="C">una capacidad (F)</option></select>
  <div class="res" id="xres">—</div>
  <div class="formula" id="xform"></div>
</section>

<section>
  <h2>Inventario</h2>
  <div class="fila">
    <div><label for="ival">Valor comercial</label><input id="ival" placeholder="4n7, 22p, 1k5…" autocomplete="off"></div>
    <div><label for="itipo">Componente</label><select id="itipo"><option>C</option><option>R</option><option>L</option></select></div>
  </div>
  <button id="agregar">Agregar</button>
  <div id="alerta"></div>
  <ul id="lista"></ul>
  <p class="formula" id="meta"></p>
</section>

<section>
  <h2>Respaldo del Inventario</h2>
  <button id="exportar" class="sec">Exportar como código</button>
  <button id="descargar" class="sec">Descargar archivo</button>
  <textarea id="codigo" placeholder="El código exportado aparece acá. Para importar, pegá un código y tocá Importar."></textarea>
  <div class="fila">
    <button id="importar">Importar código</button>
    <button id="importarArchivo" class="sec">Importar archivo</button>
  </div>
  <input type="file" id="archivo" accept=".json,application/json,text/plain" hidden>
</section>

<section>
  <h2>Diagnóstico</h2>
  <table id="diag"></table>
  <div class="fila">
    <button id="persistir" class="sec">Pedir persistencia</button>
    <button id="compartir">Compartir diagnóstico</button>
  </div>
  <textarea id="diagTexto" readonly hidden></textarea>
</section>

</main>
<script>
const VERSION = 'v2'; // Cambiar también en sw.js para probar una actualización.
document.getElementById('ver').textContent = VERSION;
const $ = (id) => document.getElementById(id);

// ---------- Entrada flexible (mínima, no es lo que se prueba) ----------
const PREF = { p:1e-12, n:1e-9, u:1e-6, 'µ':1e-6, m:1e-3, k:1e3, K:1e3, M:1e6, G:1e9 };
function parseValor(txt) {
  let s = String(txt).trim().replace(/\s+/g, '').replace(/(hz|ohm|Ω|h|f)$/i, '').replace(',', '.');
  let m = s.match(/^(\d*)([pnuµmkKMG])(\d+)$/); // 4n7, 1k5
  if (m) return parseFloat((m[1] || '0') + '.' + m[3]) * PREF[m[2]];
  m = s.match(/^(\d*)[rR](\d+)$/); // 4R7
  if (m) return parseFloat((m[1] || '0') + '.' + m[2]);
  m = s.match(/^([\d.]+(?:e[+-]?\d+)?)([pnuµmkKMG]?)$/i);
  if (m) return parseFloat(m[1]) * (m[2] ? PREF[m[2]] : 1);
  return NaN;
}
function ing(x, unidad) {
  if (!isFinite(x)) return '—';
  const p = [[1e9,'G'],[1e6,'M'],[1e3,'k'],[1,''],[1e-3,'m'],[1e-6,'µ'],[1e-9,'n'],[1e-12,'p']];
  for (const [f, s] of p) if (Math.abs(x) >= f) return (x / f).toPrecision(4).replace(/\.?0+$/, '').replace('.', ',') + ' ' + s + unidad;
  return x.toExponential(3) + ' ' + unidad;
}

// ---------- Calculadora de reactancia ----------
function calcular() {
  const f = parseValor($('f').value), v = parseValor($('lc').value), t = $('tipo').value;
  let X, form;
  if (t === 'L') { X = 2 * Math.PI * f * v; form = 'X<sub>L</sub> = 2π·f·L'; }
  else { X = 1 / (2 * Math.PI * f * v); form = 'X<sub>C</sub> = 1 / (2π·f·C)'; }
  $('xres').textContent = (t === 'L' ? 'XL = ' : 'XC = ') + ing(X, 'Ω');
  $('xform').innerHTML = form + ' · f = ' + ing(f, 'Hz') + ' · ' + t + ' = ' + ing(v, t === 'L' ? 'H' : 'F');
}
['f', 'lc', 'tipo'].forEach((id) => $(id).addEventListener('input', calcular));
calcular();

// ---------- Almacenamiento: localStorage con caída a memoria ----------
const CLAVE = 'asistente-e3-proto-inventario';
let lsError = null;
try { localStorage.setItem('__t', '1'); localStorage.removeItem('__t'); }
catch (e) { lsError = e.name + ': ' + e.message; }
let memoria = null;
function leer() {
  if (lsError) return memoria || { items: [], creado: null, aperturas: 0 };
  try { return JSON.parse(localStorage.getItem(CLAVE)) || { items: [], creado: null, aperturas: 0 }; }
  catch { return { items: [], creado: null, aperturas: 0 }; }
}
function guardar(d) {
  if (lsError) { memoria = d; return; }
  try { localStorage.setItem(CLAVE, JSON.stringify(d)); }
  catch (e) { lsError = e.name + ': ' + e.message; memoria = d; mostrarAlerta(); }
}
function mostrarAlerta() {
  if (!lsError) return;
  $('alerta').style.display = 'block';
  $('alerta').textContent = 'Este navegador no deja guardar datos acá (' + lsError + '). El Inventario se pierde al cerrar.';
}
let datos = leer();
datos.aperturas = (datos.aperturas || 0) + 1;
datos.ultimaApertura = new Date().toISOString();
guardar(datos);
mostrarAlerta();

function pintarLista() {
  const ul = $('lista'); ul.innerHTML = '';
  datos.items.forEach((it, i) => {
    const li = document.createElement('li');
    li.innerHTML = '<span><b>' + it.tipo + '</b> ' + ing(it.valor, { C:'F', R:'Ω', L:'H' }[it.tipo]) + '</span>';
    const b = document.createElement('button'); b.textContent = 'Quitar';
    b.onclick = () => { datos.items.splice(i, 1); guardar(datos); pintarLista(); };
    li.appendChild(b); ul.appendChild(li);
  });
  $('meta').textContent = datos.creado
    ? 'Primer valor guardado: ' + new Date(datos.creado).toLocaleString('es-AR') + ' · aperturas: ' + datos.aperturas
    : 'Todavía no hay valores guardados · aperturas: ' + datos.aperturas;
}
$('agregar').onclick = () => {
  const v = parseValor($('ival').value);
  if (!isFinite(v) || v <= 0) { $('ival').focus(); return; }
  datos.items.push({ tipo: $('itipo').value, valor: v });
  if (!datos.creado) datos.creado = new Date().toISOString();
  guardar(datos); $('ival').value = ''; pintarLista(); diagnostico();
};
pintarLista();

// ---------- Exportar / importar ----------
const PREFIJO = 'E3INV1:';
const exportarTexto = () => PREFIJO + btoa(unescape(encodeURIComponent(JSON.stringify(datos.items))));
function importarTexto(t) {
  t = t.trim();
  let items;
  try { items = t.startsWith(PREFIJO) ? JSON.parse(decodeURIComponent(escape(atob(t.slice(PREFIJO.length))))) : JSON.parse(t); }
  catch { alert('El código no es válido.'); return; }
  if (!Array.isArray(items)) { alert('El código no es válido.'); return; }
  datos.items = items;
  if (!datos.creado) datos.creado = new Date().toISOString();
  guardar(datos); pintarLista(); alert('Inventario importado: ' + items.length + ' valores.');
}
$('exportar').onclick = () => { $('codigo').value = exportarTexto(); $('codigo').select(); };
$('descargar').onclick = () => {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([JSON.stringify(datos.items, null, 1)], { type: 'application/json' }));
  a.download = 'inventario-e3.json'; a.click();
};
$('importar').onclick = () => importarTexto($('codigo').value);
$('importarArchivo').onclick = () => $('archivo').click();
$('archivo').onchange = async (e) => { const f = e.target.files[0]; if (f) importarTexto(await f.text()); };

// ---------- Service worker y aviso de versión nueva ----------
const swPermitido = 'serviceWorker' in navigator && (location.protocol === 'https:' || ['localhost', '127.0.0.1'].includes(location.hostname));
let swEstado = swPermitido ? 'registrando…' : ('serviceWorker' in navigator ? 'no aplica en ' + location.protocol : 'no soportado');
let esperando = null, actualizando = false;
function mostrarAviso(sw) { esperando = sw; $('aviso').style.display = 'block'; }
$('recargar').onclick = () => { actualizando = true; if (esperando) esperando.postMessage('skipWaiting'); };
if (swPermitido) {
  navigator.serviceWorker.addEventListener('controllerchange', () => { if (actualizando) location.reload(); });
  navigator.serviceWorker.register('sw.js').then((reg) => {
    swEstado = 'registrado';
    if (reg.waiting && navigator.serviceWorker.controller) mostrarAviso(reg.waiting);
    reg.addEventListener('updatefound', () => {
      const nuevo = reg.installing;
      nuevo.addEventListener('statechange', () => {
        if (nuevo.state === 'installed' && navigator.serviceWorker.controller) mostrarAviso(nuevo);
        diagnostico();
      });
    });
    reg.update().catch(() => {});
    diagnostico();
  }).catch((e) => { swEstado = 'error: ' + e.message; diagnostico(); });
}

// ---------- Persistencia ----------
async function pedirPersistencia() {
  if (!navigator.storage || !navigator.storage.persist) return 'API no disponible';
  try { return (await navigator.storage.persist()) ? 'concedida' : 'denegada'; } catch (e) { return 'error: ' + e.name; }
}
let persistResultado = 'sin pedir';
pedirPersistencia().then((r) => { persistResultado = r + ' (al abrir)'; diagnostico(); });
$('persistir').onclick = async () => { persistResultado = (await pedirPersistencia()) + ' (a mano)'; diagnostico(); };

// ---------- IndexedDB (prueba aparte: el Asistente real podría usarlo) ----------
function probarIDB() {
  return new Promise((res) => {
    if (!('indexedDB' in window)) return res('no soportado');
    let req;
    try { req = indexedDB.open('asistente-e3-proto', 1); } catch (e) { return res(e.name); }
    req.onupgradeneeded = () => req.result.createObjectStore('kv');
    req.onerror = () => res('error: ' + (req.error && req.error.name));
    req.onsuccess = () => {
      try {
        const tx = req.result.transaction('kv', 'readwrite');
        const st = tx.objectStore('kv');
        const g = st.get('aperturas');
        g.onsuccess = () => {
          const n = (g.result || 0) + 1;
          st.put(n, 'aperturas');
          tx.oncomplete = () => res('ok · aperturas registradas: ' + n);
        };
      } catch (e) { res('error: ' + e.name); }
    };
  });
}
let idbResultado = 'probando…';
probarIDB().then((r) => { idbResultado = r; diagnostico(); });

// ---------- Diagnóstico ----------
async function diagnostico() {
  const standalone = matchMedia('(display-mode: standalone)').matches || navigator.standalone === true;
  let persisted = '—', estimacion = '—', cache = '—';
  try { if (navigator.storage && navigator.storage.persisted) persisted = (await navigator.storage.persisted()) ? 'sí' : 'no'; } catch (e) { persisted = e.name; }
  try { if (navigator.storage && navigator.storage.estimate) { const e = await navigator.storage.estimate(); estimacion = ing(e.usage, 'B') + ' de ' + ing(e.quota, 'B'); } } catch (e) { estimacion = e.name; }
  try { if ('caches' in window) cache = (await caches.keys()).join(', ') || 'vacía'; } catch (e) { cache = e.name; }
  const filas = [
    ['Versión', VERSION],
    ['Dirección', location.protocol + '//' + location.host + location.pathname],
    ['Abierto como app instalada', standalone ? 'sí' : 'no (pestaña o archivo)'],
    ['Conexión', navigator.onLine ? 'con conexión' : 'SIN conexión'],
    ['Service worker', swEstado + (navigator.serviceWorker && navigator.serviceWorker.controller ? ' · controla la página' : '')],
    ['Caché sin conexión', cache],
    ['localStorage', lsError ? 'FALLA · ' + lsError : 'ok'],
    ['IndexedDB', idbResultado],
    ['Valores en el Inventario', String(datos.items.length)],
    ['Aperturas (localStorage)', String(datos.aperturas)],
    ['Primer valor guardado', datos.creado ? new Date(datos.creado).toLocaleString('es-AR') : '—'],
    ['persist() pedido', persistResultado],
    ['persisted()', persisted],
    ['Espacio usado', estimacion],
    ['Navegador', navigator.userAgent],
  ];
  const malo = (k, v) => /FALLA|SIN conexión|error|denegada|no soportado/.test(v);
  $('diag').innerHTML = filas.map(([k, v]) => '<tr><td>' + k + '</td><td class="' + (malo(k, v) ? 'mal' : '') + '">' + v.replace(/</g, '&lt;') + '</td></tr>').join('');
  $('diagTexto').value = 'Diagnóstico Asistente E3 (prototipo) · ' + new Date().toLocaleString('es-AR') + '\n' + filas.map(([k, v]) => k + ': ' + v).join('\n');
}
addEventListener('online', diagnostico); addEventListener('offline', diagnostico);
$('compartir').onclick = async () => {
  await diagnostico();
  const texto = $('diagTexto').value;
  if (navigator.share) { try { await navigator.share({ text: texto }); return; } catch (e) { if (e.name === 'AbortError') return; } }
  try { await navigator.clipboard.writeText(texto); alert('Diagnóstico copiado. Pegalo en WhatsApp.'); }
  catch { $('diagTexto').hidden = false; $('diagTexto').select(); alert('Copiá el texto seleccionado.'); }
};
diagnostico();
</script>
</body>
</html>
